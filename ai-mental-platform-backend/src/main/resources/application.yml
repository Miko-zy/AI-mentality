server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-mental-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_mental_platform?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aimental.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== AI 大模型配置（OpenAI 兼容协议） ====================
# 说明：业务层只依赖 OpenAI 兼容接口，不绑定任何厂商 SDK，换厂商只需修改下面的配置。
# 首选：智谱开放平台免费模型 GLM-4.7-Flash
#   Key 申请地址：https://bigmodel.cn/usercenter/proj-mgmt/apikeys
#   接口文档：https://docs.bigmodel.cn/cn/guide/develop/openai/introduction
# 备选：阿里云百炼（qwen3.6-flash 等，新用户有免费额度）
#   Key 申请地址：https://bailian.console.aliyun.com/
#   base-url 改为：https://dashscope.aliyuncs.com/compatible-mode/v1
# 安全提示：api-key 请通过环境变量 AI_API_KEY 注入，绝对不要把真实 Key 写进代码或提交到仓库
ai:
  llm:
    # 是否启用真实大模型调用：false 时使用本地模拟回复，保证没有 Key 也能跑通完整链路
    enabled: ${AI_ENABLED:false}
    # OpenAI 兼容接口基础地址（不要带 /chat/completions）
    base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    # 此处填写智谱（或备选厂商）平台的 Key，申请地址见上方注释
    api-key: ${AI_API_KEY:}
    # 模型名称：智谱免费模型 glm-4.7-flash；备选可改为 qwen3.6-flash
    model: ${AI_MODEL:glm-4.7-flash}
    # 采样温度：谈心场景不宜过高，避免回复发散
    temperature: 0.7
    # 送入模型的历史对话轮数上限
    max-history-rounds: 10
    # 连接超时与请求超时（秒）
    connect-timeout-seconds: 10
    request-timeout-seconds: 90

jwt:
  secret: aimentalplatformjwtsecretkey2024verylongsecretkeyforjwttoken
  expiration: 86400000
  header: Authorization
  prefix: Bearer

aes:
  secret-key: aimentalplatformaes256secretkey2024
